[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portable-genie-skills"
version = "0.1.0"
description = "Adapt and validate portable agent skills for Databricks Genie One and Genie Code."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "pyyaml>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.13,<1",
]

[project.scripts]
portable-skills = "portable_genie_skills.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/portable_genie_skills"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
